<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Скачивание Яндекс Диска</title><style>body{font:18px system-ui;max-width:850px;margin:40px auto;padding:16px;background:#f6f8fa;color:#152538}article{padding:20px;background:white;border-radius:12px;margin:16px 0}progress{width:100%;height:22px}small{color:#567}a{color:#1659b7}</style><h1>Скачивание Яндекс Диска</h1><p>Свежие копии сохраняются на Mac. Облачные файлы удаляются только после полной загрузки партии и проверки размера и MD5.</p><div id="status">Загрузка статуса…</div><p><a href="/yadisk-final-audit.json">Итог общего аудита (появится после завершения обеих партий)</a></p><script>const gb=n=>(n/1e9).toFixed(2);async function load(){try{const r=await fetch('/yadisk-status.json',{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();const out=document.getElementById('status');out.replaceChildren();for(const [key,label]of [['five','Дополнительные 5 ГБ'],['fifty_two','Дополнительные 52 ГБ']]){const b=d[key],a=document.createElement('article'),h=document.createElement('h2');h.textContent=label;a.append(h);const p=document.createElement('p');p.textContent=`Загружено ${gb(b.received_bytes)} из ${gb(b.bytes)} ГБ. Проверено файлов: ${b.verified_files} из ${b.files}.`;a.append(p);const bar=document.createElement('progress');bar.max=b.bytes;bar.value=b.received_bytes;a.append(bar);const s=document.createElement('p');s.textContent=b.result?`Удалено с Диска: ${b.result.deleted_files} файлов, ${gb(b.result.deleted_bytes)} ГБ. Ошибок: ${b.result.errors.length}.`:b.download_failed?'Не все файлы скачались. Эта партия с Диска не удалена.':'Загрузка и проверка продолжаются. Удаление этой партии пока не подтверждено.';a.append(s);const loc=document.createElement('small');loc.textContent=b.local_root;a.append(loc);out.append(a)}const p=document.createElement('p');p.textContent=`Старый недокачанный остаток: ${d.old_remaining} файлов. Из 95 новых осталось скачать: ${d.new_remaining}.`;out.append(p);const date=document.createElement('small');date.textContent='Статус обновлён: '+d.updated;out.append(date)}catch(e){document.getElementById('status').textContent='Статус пока недоступен. Повторная попытка через 20 секунд.'}}load();setInterval(load,20000);</script></html>
