<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дашборд · финансы</title>
<style>
:root{
  --bg:#f6f5f2; --card:#fff; --ink:#1c1b19; --dim:#6b6862; --line:#e3e0da;
  --accent:#8a5a18; --accent-soft:rgba(138,90,24,.10);
  --good:#2f6b3f; --bad:#a03328; --warn:#8a6a18;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141311;--card:#1e1d1a;--ink:#eceae5;--dim:#9d998f;--line:#302e2a;
        --accent:#d19a4e;--accent-soft:rgba(209,154,78,.12);
        --good:#6fbf85;--bad:#e0796b;--warn:#d7ad55}
}
*{box-sizing:border-box}
body{margin:0;padding:22px 20px 60px;background:var(--bg);color:var(--ink);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1240px;margin:0 auto}
h1{font-size:21px;margin:0 0 2px;font-weight:650;letter-spacing:-.01em}
.sub{color:var(--dim);font-size:12.5px;margin-bottom:20px}
nav{margin-bottom:18px;display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
nav a{color:var(--accent);text-decoration:none}
nav a:hover{text-decoration:underline}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px 15px}
.kpi .l{font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:23px;font-weight:650;margin-top:5px;letter-spacing:-.02em;
        font-variant-numeric:tabular-nums}
.kpi .n{font-size:12px;color:var(--dim);margin-top:3px}
.kpi.bad .v{color:var(--bad)} .kpi.good .v{color:var(--good)} .kpi.warn .v{color:var(--warn)}
section{background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:15px 17px;margin-bottom:16px}
h2{font-size:13.5px;margin:0 0 12px;font-weight:600;letter-spacing:.01em}
h2 small{font-weight:400;color:var(--dim);margin-left:7px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:500;color:var(--dim);font-size:11.5px;
  text-transform:uppercase;letter-spacing:.03em;padding:0 10px 7px 0;border-bottom:1px solid var(--line)}
td{padding:6px 10px 6px 0;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.neg{color:var(--bad)} .pos{color:var(--good)} .muted{color:var(--dim)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.chart{width:100%;height:230px;display:block}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:11px}
.fact{border:1px solid var(--line);border-radius:9px;padding:11px 13px}
.fact.bad{border-color:rgba(160,51,40,.4);background:rgba(160,51,40,.05)}
.fact .t{font-size:11.5px;color:var(--dim)}
.fact .v{font-size:16.5px;font-weight:620;margin:3px 0;letter-spacing:-.01em}
.fact .s{font-size:12px;color:var(--dim)}
.fact .w{font-size:12px;margin-top:5px;padding-top:5px;border-top:1px solid var(--line)}
.pill{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;
  background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.err{color:var(--bad);font-size:13px}
button{font:inherit;padding:5px 11px;border-radius:7px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
</style></head>
<body><div class="wrap">
<nav>
  <a href="/">← Трекер</a><a href="plan.html">План</a><a href="tasks.html">Задачи</a>
  <a href="cards.html">Карты</a><a href="optimize.html">Оптимизация</a>
</nav>
<h1>Дашборд</h1>
<div class="sub" id="asof">загружаю…</div>

<div class="kpis" id="kpis"></div>

<section>
  <h2>Остаток по дням <small id="chartNote"></small></h2>
  <div class="scroll"><svg class="chart" id="chart" preserveAspectRatio="none"></svg></div>
</section>

<div class="grid2">
  <section><h2>Ближайшие движения <small>14 дней</small></h2>
    <div class="scroll"><table id="soon"></table></div></section>
  <section><h2>Задачи <small>ближайшие</small></h2>
    <div class="scroll"><table id="tasks"></table></div></section>
</div>

<div class="grid2">
  <section><h2>Валюта и крипта</h2><div class="scroll"><table id="assets"></table></div></section>
  <section><h2>Самые тяжёлые месяцы</h2><div class="scroll"><table id="months"></table></div></section>
</div>

<section><h2>Финансовый инбокс <small id="inboxN"></small></h2>
  <div class="facts" id="inbox"></div></section>

<section><h2>Факты из выписок <small id="factsPeriod"></small></h2>
  <div class="facts" id="facts"></div></section>

<script src="engine.js?v=20260828"></script>
<script>
// Дашборд не считает ничего сам — вся арифметика берётся из engine.js, того же,
// на котором работает plan.html. Иначе две страницы разошлись бы в цифрах.
let data=null;
const F=n=>Math.round(n||0).toLocaleString('ru-RU');
const F2=n=>(n||0).toLocaleString('ru-RU',{maximumFractionDigits:0});
const esc=s=>String(s??'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const RU=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const human=k=>{const [y,m,d]=k.split('-');return +d+' '+RU[+m-1];};

async function j(u){ try{ const r=await fetch(u,{cache:'no-store'}); return r.ok?await r.json():null; }
                     catch(e){ return null; } }

function kpi(l,v,n,cls){ return `<div class="kpi ${cls||''}"><div class="l">${l}</div>`
  +`<div class="v">${v}</div><div class="n">${n||''}</div></div>`; }

function drawChart(series){
  const svg=document.getElementById('chart');
  const W=1200,H=230,PL=62,PR=12,PT=14,PB=22;
  const xs=series.map((p,i)=>i), ys=series.map(p=>p.run);
  const lo=Math.min(0,...ys), hi=Math.max(...ys);
  const X=i=>PL+(W-PL-PR)*(i/Math.max(1,series.length-1));
  const Y=v=>PT+(H-PT-PB)*(1-(v-lo)/Math.max(1,hi-lo));
  let d='', g='', lab='';
  series.forEach((p,i)=>{ d+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.run).toFixed(1); });
  // горизонтальные линии сетки
  for(let k=0;k<=3;k++){
    const v=lo+(hi-lo)*k/3, y=Y(v);
    g+=`<line x1="${PL}" x2="${W-PR}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`
      +`<text x="${PL-7}" y="${y+3.5}" text-anchor="end" font-size="10" fill="var(--dim)">${F(v/1000)}к</text>`;
  }
  // подписи месяцев
  let prevM='';
  series.forEach((p,i)=>{ const m=p.k.slice(5,7);
    if(m!==prevM){ prevM=m;
      lab+=`<text x="${X(i)}" y="${H-6}" font-size="10" fill="var(--dim)">${RU[+m-1]}</text>`; }});
  // минимум
  const mi=ys.indexOf(Math.min(...ys)), mp=series[mi];
  const area=d+`L${X(series.length-1).toFixed(1)} ${Y(lo)}L${X(0).toFixed(1)} ${Y(lo)}Z`;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.innerHTML=g
    +`<path d="${area}" fill="var(--accent-soft)"/>`
    +`<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.8"/>`
    +`<circle cx="${X(mi)}" cy="${Y(mp.run)}" r="3.6" fill="var(--bad)"/>`
    +`<text x="${X(mi)+7}" y="${Y(mp.run)+4}" font-size="11" fill="var(--bad)">мин ${F(mp.run)} · ${human(mp.k)}</text>`
    +lab;
  document.getElementById('chartNote').textContent=
    `${human(series[0].k)} → ${human(series[series.length-1].k)}, ${series.length} дней`;
}

function tbl(el,head,rows,empty){
  const t=document.getElementById(el);
  if(!rows.length){ t.innerHTML=`<tr><td class="muted">${empty}</td></tr>`; return; }
  t.innerHTML='<tr>'+head.map(h=>`<th${h[1]?' class="num"':''}>${h[0]}</th>`).join('')+'</tr>'
    +rows.map(r=>'<tr>'+r.map((c,i)=>`<td${head[i][1]?' class="num"':''}>${c}</td>`).join('')+'</tr>').join('');
}

(async()=>{
  const [plan,port,facts,tasks]=await Promise.all(
    [j('/api/plan'),j('/api/portfolio'),j('/api/facts'),j('/api/tasks')]);
  if(!plan||!plan.rows){ document.getElementById('asof').innerHTML=
    '<span class="err">plan.json не отдался — запущен ли сервер трекера?</span>'; return; }
  data=plan;
  const fx=await j('/api/rate'); if(fx) FX=fx;
  const cr=await j('/api/crypto'); if(cr) CR=cr;

  const r=runBalance(), sp=data.startParts||{}, S=r.series;
  const usdNow=(sp.freedom||0)+(sp.tbc||0)+(sp.bybit||0)+(sp.cashusd||0);
  const rubNow=sp.raif||0;
  const lo=S.reduce((a,p)=>p.run<a.run?p:a,S[0]);
  const end=r.dif[r.dif.length-1];

  // долги — расходные строки со словом «ипотек»/«кредит», ещё не прошедшие
  let debt=0;
  data.rows.forEach((row,ri)=>{
    if(TYPE(ri)==='inc') return;
    if(!/ипотек|кредит|долг/i.test(LBL(ri))) return;
    debt+=row.reduce((a,b)=>a+(b||0),0);
  });

  document.getElementById('asof').textContent=
    'данные plan.json · курс ЦБ '+(cbrUsd()?cbrUsd().toFixed(2)+' ₽/$':'нет')
    +' · пересчитано только с сегодняшнего дня';

  document.getElementById('kpis').innerHTML=
     kpi('На счетах сейчас',F(data.start||0)+' ₽','Райф '+F(rubNow)+' · $'+F(usdNow))
    +kpi('Минимум года',F(lo.run)+' ₽',human(lo.k),lo.run<100000?'bad':'warn')
    +kpi('Осталось долгов',F(debt)+' ₽',debt?'ипотека ДОМ.РФ':'всё закрыто',debt?'warn':'good')
    +kpi('Итог янв.27',F(end)+' ₽','+ валюта $'+F(r.usdDif[r.usdDif.length-1]),'good')
    +kpi('Проценты за год','+'+F(r.pct.reduce((a,b)=>a+b,0))+' ₽',RATE*100+'% на остаток Райфа','good');

  drawChart(S);

  // ближайшие 14 дней
  const soon=S.slice(0,14).filter(p=>p.i||p.e).map(p=>[
    human(p.k), p.i?`<span class="pos">+${F(p.i)}</span>`:'', p.e?`<span class="neg">−${F(p.e)}</span>`:'',
    `<span class="${p.run<50000?'neg':''}">${F(p.run)}</span>`]);
  tbl('soon',[['дата',0],['приход',1],['расход',1],['остаток',1]],soon,'ближайшие две недели без движений');

  // задачи
  const T=((tasks&&tasks.tasks)||[]).filter(t=>!t.done&&t.date).sort((a,b)=>a.date<b.date?-1:1).slice(0,9);
  tbl('tasks',[['дата',0],['что',0]],
    T.map(t=>[t.date.slice(8,10)+'.'+t.date.slice(5,7),esc(t.txt).slice(0,110)]),'задач нет');

  // активы
  const A=[['Райффайзен ₽',F(sp.raif||0)],['Яндекс ₽',F(sp.ya||0)],['Наличные ₽',F(sp.cash||0)],
           ['Freedom $',F(sp.freedom||0)],['TBC $',F(sp.tbc||0)],['Bybit $',F(sp.bybit||0)],
           ['Наличные $',F(sp.cashusd||0)]];
  if(port&&port.total) A.push(['Крипта $ <span class="pill">'+(port.day||'?')+'</span>',
    F(port.total)+' <span class="muted">= токены '+F(port.tokens)+' + NFT '+F(port.nft)+'</span>']);
  tbl('assets',[['актив',0],['сумма',1]],A,'нет данных');

  // месяцы по минимуму
  const M=MONTHS.map((m,i)=>({name:m.name,dip:Math.min(...m.cols.map(c=>r.dip[c])),
                              end:r.dif[m.cols[m.cols.length-1]],pct:r.pct[i]}))
    .sort((a,b)=>a.dip-b.dip).slice(0,6);
  tbl('months',[['месяц',0],['минимум',1],['конец',1],['%',1]],
    M.map(m=>[m.name,`<span class="${m.dip<100000?'neg':''}">${F(m.dip)}</span>`,F(m.end),'+'+F(m.pct)]),'—');

  // финансовый инбокс — задачи без даты, сгруппированные по [Категории] в тексте
  const IB=((tasks&&tasks.tasks)||[]).filter(t=>!t.done&&!t.date&&t.fin);
  const byGrp={};
  IB.forEach(t=>{ const m=/^\[([^\]]+)\]\s*(.*)$/.exec(t.txt||'');
    const g=m?m[1]:'Прочее', s=m?m[2]:t.txt;
    (byGrp[g]=byGrp[g]||[]).push(s); });
  document.getElementById('inboxN').textContent=IB.length?IB.length+' без даты':'';
  document.getElementById('inbox').innerHTML=Object.keys(byGrp).length
    ? Object.entries(byGrp).map(([g,list])=>
        `<div class="fact"><div class="t">${esc(g)}</div>`
        +`<div class="v" style="font-size:13.5px">${list.length} шт.</div>`
        +`<div class="s">${list.map(esc).join('<br>')}</div></div>`).join('')
    : '<div class="muted">инбокс пуст</div>';

  // факты
  if(facts&&facts.cards){
    document.getElementById('factsPeriod').textContent=facts.period||'';
    document.getElementById('facts').innerHTML=facts.cards.map(c=>
      `<div class="fact ${c.bad?'bad':''}"><div class="t">${esc(c.t)}</div>`
      +`<div class="v">${esc(c.v)}</div><div class="s">${esc(c.s)}</div>`
      +(c.w?`<div class="w">${esc(c.w)}</div>`:'')+'</div>').join('');
  } else {
    document.getElementById('facts').innerHTML='<div class="muted">facts.json не найден</div>';
  }
})();
</script>
</div></body></html>
